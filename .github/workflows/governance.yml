name: Governance Gate

# Single job on purpose: the exhaustive governance set stays in one
# deterministic job (no matrix, no split). The ci-governance checker pins
# every declaration below, so this workflow cannot drift silently.
on:
  workflow_dispatch:
  push:
    paths:
      - "openspec/**"
      - "deep_research_harness/**"
      - ".github/workflows/governance.yml"
      - ".githooks/**"
  pull_request:
    paths:
      - "openspec/**"
      - "deep_research_harness/**"
      - ".github/workflows/governance.yml"
      - ".githooks/**"

permissions:
  contents: read

concurrency:
  group: governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # submodules: true is load-bearing — the architecture checker validates
      # the nested gitlink HEAD and porcelain state (v2 lesson: CI died at
      # checkout until this was audited).
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned to the generation-aligned version (same as .agents/skills
      # frontmatter); the gate's strict-validation owner needs this CLI.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pin the OpenSpec CLI
        run: npm install -g @fission-ai/openspec@1.14.0
      - name: Governance unittest suite
        run: python3 -m unittest discover -s openspec/tests/governance -q
      - name: Aggregate closeout gate
        run: python3 openspec/governance/check_project_gate.py --phase closeout
      - name: Document hygiene
        run: python3 openspec/governance/check_doc_hygiene.py
      - name: Harness verify
        run: UV_OFFLINE=1 make verify
        working-directory: deep_research_harness
      - uses: astral-sh/setup-uv@v7
      - name: Harness integration smoke (fixture lane, zero credentials)
        run: make smoke
        working-directory: deep_research_harness
      - name: Harness lint (ruff; the local convenience lane promoted to the gate)
        run: make lint
        working-directory: deep_research_harness
