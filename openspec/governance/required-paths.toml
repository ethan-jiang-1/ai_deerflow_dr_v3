schema_version = 1
contract = "project-structure-inventory"

# Required-path inventory, grouped by owning feature family.
# Every path is repository-relative, normalized, and MUST exist with the
# declared kind. Group names are declared keys (existence + uniqueness only).
# See project-structure.toml [inventory].
#
# 实现文件随各自 change 的清单增补登记；未登记的路径不构成本清单的承诺。

