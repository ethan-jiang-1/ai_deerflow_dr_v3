# Requirement ID Registry
#
# 需求 ID 的唯一登记处。规则沿自前代仓库（ai_deerflow_deep_research_v2）的治理思想；
# 本仓库（v3）从零开始分配，与前代 ID 空间互不通用。
#
# 规则:
#   1. 只增不删 — 已分配的 ID 永不复用，废弃的在描述末尾追加 [DEPRECATED]
#   2. 分配前先查 — 在此文件中搜索确认 ID 未被占用
#   3. 格式:  PREFIX-NNN: <capability-name> — <description>
#      - key 是全局唯一 ID，格式 [A-Z]{3}-\d{3}
#      - value 的 <capability-name> 用 kebab-case
#   4. 引号:  YAML 值不需要引号，除非值内包含 ": "（冒号+空格）
#      切勿用单引号——YAML 单引号内无法转义，双引号用 \" 即可。
#   5. check_project_reqs.py 扫描本文件做一致性校验
#
# 三态:
#   alive   — ID 出现在 openspec/specs/ 某个 main spec 的 > req: 行
#   pending — ID 出现在 openspec/changes/<active>/specs/ 的 delta spec 中
#   retired — 本行末尾标了 [DEPRECATED]，ID 占位永不复用
#
# 缩写规则: 首单词前 2 字母 + 次单词首字母（如 custom-tool → CUT，memory-policy → MEP）；
#           单词型 capability 取前 3 字母（如 skills → SKI）。冲突时先查 registry 再定。
#
# ---- 骨架期登记（2026-10-02）-------------------------------------------------
# specs 为空（从头搭），以下 ID 暂为 registered-not-alive 状态；
# 各 capability 的 owning spec 由 v3 自己的首批 change 建立。

PRS-001: project-structure — v3 仓库骨架的结构合同：治理清单、import 分层、submodule 锚

# ---- establish-run-bundle 登记（2026-10-03）------------------------------------
# Run Bundle 域契约（owning delta: openspec/changes/establish-run-bundle）。
RUB-001: run-bundle — 运行底座：目录契约、单真相状态机（revision CAS + 目录 lease）、崩溃检测与有界澄清续答状态、有界诚实 journal（anchor 永不驱逐）、永久删除语义、显式组成记录

# ---- establish-run-admission 登记（2026-10-03）--------------------------------
# 验收收口（owning delta: openspec/changes/establish-run-admission）。
RUA-001: run-admission — 验收收口：validator hold point（未裁决不入账）、sha256 哈希链三分处置 ledger（admit/reject/replay，篡改响亮失败）、gate 最小推导（pass/blocked）、封闭准入词表、质量注册处同步

# ---- establish-embedded-wiring 登记（2026-10-03）------------------------------
# 嵌入式 DeerFlow 绑定（owning delta: openspec/changes/establish-embedded-wiring）。
DEW-001: deerflow-wiring — 嵌入式绑定：显式配置解析（拒自动发现）、契约镜像锁漂移、装配快照每 run 一张、终态诚实 run engine（journal 三汇 + 有界澄清续答回路）

# ---- establish-entry-surface 登记（2026-10-03）--------------------------------
# 人类命令面（owning delta: openspec/changes/establish-entry-surface）。
ENS-001: entry-surface — 六子命令入口（create/status/watch/cancel/refine/inspect，薄委托无第二权威）、共享人话渲染、有界 watch、双梯选择、EV2 证据（journey + golden 回放）

# ---- add-ci-governance 登记（2026-10-02）--------------------------------------
# CI 门禁与本地 hook 的接受路径合同（owning delta: openspec/changes/add-ci-governance）。
CIG-001: ci-governance — CI 门禁与本地 hook 的接受路径合同：单 job CI 全量治理套件、hook 只跑便宜高置信检查、声明自身被机器校验

# ---- add-doc-budget-gate 登记（2026-10-02）------------------------------------
# 入口层预算闸（owning delta: openspec/changes/add-doc-budget-gate）。
DOB-001: doc-budgets — 入口层字符预算闸：受管常驻文件的声明上限、超限与缺失响亮报错、只降不升棘轮
