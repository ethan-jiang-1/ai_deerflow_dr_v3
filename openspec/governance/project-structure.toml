schema_version = 1
contract = "project-structure"
# requirement_ids = 结构清单里 [paths.<ID>] 分组的 owner 全集（须先在
# req-registry 注册）。PRS-001 = 结构合同锚（owning spec 已由 change
# establish-project-structure 建立）；CIG-001 = CI/hook 接受路径文件的
# owner（随 add-ci-governance 登记）；DOB-001 = 入口层预算闸的 owner
#（随 add-doc-budget-gate 登记，无新增结构路径——预算表在 doc-hygiene
# checker 内声明）。
requirement_ids = ["PRS-001", "CIG-001", "DOB-001"]

[upstream_gitlink]
path = "deerflow"
commit = "ceebf97fc31afbbfe2aadf7c8d82b03c3742d5d7"

[guide]
path = "deep_research_harness/AGENTS.md"
begin_marker = "<!-- BEGIN GENERATED: PROJECT-STRUCTURE -->"
end_marker = "<!-- END GENERATED: PROJECT-STRUCTURE -->"

[package]
source_root = "deep_research_harness/src/deerflow_deep_research"
test_root = "deep_research_harness/tests"
ownership_layers = ["runtime", "domain", "engine", "agents", "graph"]
forbidden_source_roots = ["backend", "frontend"]
forbidden_shared_modules = ["utils", "helpers", "common"]

# fixture_root / fixture_package：骨架期缺省（checker 中为可选项）。
# 显式组成（all_real/fixture/mixed）落地时随 owning spec 一并声明。

[ignored_paths]
path = "deep_research_harness/.gitignore"
entries = [".venv/", ".pytest_cache/", ".ruff_cache/", "__pycache__/"]

[inventory]
path = "openspec/governance/required-paths.toml"

# Import-boundary keys：六个 import 层（含 nodes——graph 自有的节点包子层）。
# 内部层方向由 checker 硬编码政策固定；此处每层的值 = 内部层名 + 该层授权的外部命名空间。
[imports]
domain = ["stdlib", "pydantic"]
engine = ["domain"]
agents = ["domain"]
graph = ["domain", "engine", "nodes"]
nodes = ["domain", "engine"]
runtime = ["domain", "graph", "agents"]

[node_packages]
root = "deep_research_harness/src/deerflow_deep_research/graph/nodes"
required_files = ["__init__.py", "node.py", "contracts.py"]
optional_files = ["subgraph.py", "capabilities.py"]
forbidden_files = ["fake.py"]
public_export = "NODE_SPEC"
