[project]
name = "deerflow-deep-research"
description = "Deep research runtime harness for DeerFlow (v3 rewrite)"
requires-python = ">=3.12"
dynamic = ["version"]
# 嵌入式接线（establish-embedded-wiring）：DeerFlow harness 包进入运行时依赖。
dependencies = ["deerflow-harness"]

[dependency-groups]
# Dev tools are local conveniences, never gate dependencies: the unit gate is
# stdlib-only (the CI job installs nothing). Each entry states its role.
dev = [
    "pytest>=9.0.3",   # local runner for the same tests the stdlib gate runs
    "ruff>=0.14.11",   # lint/format lane (make lint; enforced in CI as a governance-gate step)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/deerflow_deep_research/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/deerflow_deep_research"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# `tests/support.py` is imported by name, not by package path: the test root is
# placed on sys.path by the suite runner, so `import support` is the working form
# and isort cannot see the usage.
# any test module importing the shared fixtures by name
"tests/**/*.py" = ["E402", "F401"]

[tool.uv]
index-url = "https://pypi.org/simple"

[tool.uv.sources]
deerflow-harness = { path = "../deerflow/backend/packages/harness", editable = true }
