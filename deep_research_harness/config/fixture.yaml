# fixture.yaml — zero-credential rehearsal: `use:` seams point at harness-owned fakes
# (runtime/scripted) running the real client chain. The smoke proves this path.
config_version: 45
# Deep research exceeds the framework default (100) at ~10 tool rounds.
recursion_limit: 300
log_level: info

# Checkpoint growth: the framework default (full) stores the whole message list on
# every per-step write — a 1000-step deep-research run reached 1.0G. Delta mode keeps
# full snapshots every N writes (framework-documented cadence; coarser resume accepted).
database:
  checkpoint_channel_mode: delta
  checkpoint_delta:
    snapshot_frequency: 10

sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider
  allow_host_bash: false

models:
  - name: fixture-scripted
    display_name: Fixture Scripted Model
    use: deerflow_deep_research.runtime.scripted:ScriptedChatModel
    model: fixture-scripted
    # Zero-credential rehearsal: no secret exists here, so a literal placeholder
    # (the strict $VAR resolver would fail on an unset environment variable).
    api_key: fixture-no-secret

tool_groups:
  - name: web

tools:
  - name: web_search
    group: web
    use: deerflow_deep_research.runtime.scripted:fake_web_search

summarization:
  enabled: true

# Skill declaration slot (deerflow-wiring delta): absent = unwired posture — the
# assembly resolves it to exactly None and the binding keeps the framework default.
# Declaring a list of non-empty skill names passes them to the binding verbatim;
# activation semantics (what actually loads, and how well) are owned by a separate
# cognitive-program change, not by uncommenting this line.
# skills:
#   - deep-research

# Subagent posture (wiring plan decision 5): no custom subagent types are declared —
# DeerFlow's native deep-research delegation covers the research need. A future
# declaration must arrive through an owning change and satisfy the depth self-check
# (every custom agent excludes 'task' via disallowed_tools; guarded by
# tests/unit/test_subagent_posture.py). See the quality register.
# subagents:
#   custom_agents: []
