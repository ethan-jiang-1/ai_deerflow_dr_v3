# base.yaml — real-run configuration (shape here, secrets as $VAR references).
# Modeled on the framework's config.example.yaml active entries; the model entry is
# UNVERIFIED until a real-key run (the wiring smoke proves the fixture path instead).
config_version: 45
# Deep research exceeds the framework default (100) at ~10 tool rounds.
recursion_limit: 300
log_level: info

sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider
  allow_host_bash: false

models:
  - name: deepseek-chat
    display_name: DeepSeek Chat
    use: deerflow.models.patched_deepseek:PatchedChatDeepSeek
    model: deepseek-chat
    api_key: $DEEPSEEK_API_KEY
    supports_thinking: false

tool_groups:
  - name: web

tools:
  - name: web_search
    group: web
    use: deerflow.community.ddg_search.tools:web_search_tool
    max_results: 5
  - name: web_fetch
    group: web
    use: deerflow.community.jina_ai.tools:web_fetch_tool
    timeout: 10

# Long research runs need compaction protection (plan decision 6: explicit, not default).
summarization:
  enabled: true

# Subagent posture (wiring plan decision 5): no custom subagent types are declared —
# DeerFlow's native deep-research delegation covers the research need. A future
# declaration must arrive through an owning change and satisfy the depth self-check
# (every custom agent excludes 'task' via disallowed_tools; guarded by
# tests/unit/test_subagent_posture.py). See the quality register.
# subagents:
#   custom_agents: []
